<app-header-v2></app-header-v2>

<main class="cadastro">

  <h1 class="cadastro_titulo">Crie sua conta</h1>

  <section class="cadastro_card">

    <form class="cadastro_formulario">

      <!-- Nome -->
      <div class="cadastro_campo">
        <label for="nome">Nome e sobrenome</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome e sobrenome"
          autocomplete="name"
          required
        />
      </div>

      <!-- CPF -->
      <div class="cadastro_campo">
        <label for="cpf">CPF</label>
        <input
          type="text"
          id="cpf"
          name="cpf"
          placeholder="Digite o seu CPF"
          inputmode="numeric"
          required
        />
      </div>

      <!-- E-mail -->
      <div class="cadastro_campo">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        />
      </div>

      <!-- Celular -->
      <div class="cadastro_campo">
        <label for="celular">Celular</label>
        <input
          type="tel"
          id="celular"
          name="celular"
          placeholder="DDD + Celular"
          autocomplete="tel-national"
          required
        />
      </div>

      <!-- Telefone opcional -->
      <div class="cadastro_campo">
        <label for="telefone">
          Telefone <span>(opcional)</span>
        </label>
        <input
          type="tel"
          id="telefone"
          name="telefone"
          placeholder="DDD + Telefone"
        />
      </div>

      <!-- Gênero -->
      <div class="cadastro_campo">
        <label for="genero">
          Gênero <span>(opcional)</span>
        </label>

        <select id="genero" name="genero">
          <option value="" selected disabled>Escolha o gênero</option>
          <option value="feminino">Feminino</option>
          <option value="masculino">Masculino</option>
          <option value="nao-informar">Prefiro não opinar</option>
        </select>
      </div>

      <!-- Data de nascimento -->
      <div class="cadastro_campo">
        <label for="nascimento">
          Data de nascimento <span>(opcional)</span>
        </label>

        <input
          type="date"
          id="nascimento"
          name="nascimento"
          autocomplete="bday"
        />
      </div>

      <!-- Senhas -->
      <div class="cadastro_senhas">

        <div class="cadastro_campo">
          <label for="senha">Senha</label>

          <div class="cadastro_senha-container">
            <input
              [type]="mostrarSenha() ? 'text' : 'password'"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              autocomplete="new-password"
              required
            />

            <button
              type="button"
              class="cadastro_senha-botao"
              (click)="alternarVisibilidadeSenha()"
              [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
              [attr.aria-pressed]="mostrarSenha()"
            >
              @if (mostrarSenha()) {
                <svg lucideEyeOff class="cadastro_icone-senha"></svg>
              } @else {
                <svg lucideEye class="cadastro_icone-senha"></svg>
              }
            </button>
          </div>
        </div>

        <div class="cadastro_campo">
          <label for="confirmarSenha">Confirmar a senha</label>

          <div class="cadastro_senha-container">
            <input
              [type]="mostrarConfirmacaoSenha() ? 'text' : 'password'"
              id="confirmarSenha"
              name="confirmarSenha"
              placeholder="Confirmar sua senha"
              autocomplete="new-password"
              required
            />

            <button
              type="button"
              class="cadastro_senha-botao"
              (click)="alternarVisibilidadeConfirmacao()"
              [attr.aria-label]="mostrarConfirmacaoSenha() ? 'Ocultar senha' : 'Mostrar senha'"
              [attr.aria-pressed]="mostrarConfirmacaoSenha()"
            >
              @if (mostrarConfirmacaoSenha()) {
                <svg lucideEyeOff class="cadastro_icone-senha"></svg>
              } @else {
                <svg lucideEye class="cadastro_icone-senha"></svg>
              }
            </button>
          </div>
        </div>

      </div>

      <!-- Padrão de senha -->
      <div class="cadastro_requisitos">
        <strong>Padrão de senha</strong>

        <ul>
          <li>Mínimo 8 caracteres</li>
          <li>Letra maiúscula</li>
          <li>Letra minúscula</li>
          <li>Caractere especial</li>
          <li>Número</li>
        </ul>
      </div>

      <!-- Foto de perfil -->
      <section class="cadastro_foto">
        <h2>Foto de Perfil <span>(opcional)</span></h2>
        <p>Escolha sua foto de perfil</p>
      </section>

      <!-- Termos -->
      <div class="cadastro_termos">
        <input
          type="checkbox"
          id="termos"
          name="termos"
          required
        />

        <label for="termos">
          Concordo com os
          <a routerLink="/termos">termos e condições</a>
        </label>
      </div>

      <!-- Cadastrar -->
      <button type="button" class="cadastro_botao">
        Cadastrar
      </button>

    </form>

  </section>

  <!-- Copyright -->
  <footer class="cadastro_footer">
    <p>Copyright© 2026 Banhos UP S/A</p>
    <p>Todos os direitos reservados</p>
  </footer>

</main>
