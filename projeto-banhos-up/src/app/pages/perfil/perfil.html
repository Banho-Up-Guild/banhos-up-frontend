<app-header-v2></app-header-v2>

<main class="perfil">

  <aside class="perfil_menu">

    <div class="perfil_usuario">

      <div class="perfil_avatar">
        <svg class="icone_usuario" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4.5 21c.8-4.1 3.4-6.2 7.5-6.2s6.7 2.1 7.5 6.2"></path>
        </svg>
      </div>

      <div class="perfil_saudacao">
        <span>Olá,</span>
        <strong>{{ authService.usuarioAtual()?.name || 'Cliente' }}</strong>
      </div>

    </div>

    <nav class="perfil_navegacao">

      <a routerLink="meus-dados"
         routerLinkActive="ativo"
         class="perfil_item">

        <span class="perfil_icone">👤</span>
        <span>Meus dados</span>
        <span class="perfil_seta">›</span>

      </a>

      <a routerLink="agendamentos"
         routerLinkActive="ativo"
         class="perfil_item">

        <span class="perfil_icone">◷</span>
        <span>Meus agendamentos</span>
        <span class="perfil_seta">›</span>

      </a>

      <a routerLink="pets"
         routerLinkActive="ativo"
         class="perfil_item">

        <span class="perfil_icone">🐾</span>
        <span>Meus pets</span>
        <span class="perfil_seta">›</span>

      </a>

      <a routerLink="alterar-senha"
         routerLinkActive="ativo"
         class="perfil_item">

        <span class="perfil_icone">♧</span>
        <span>Alterar senha</span>
        <span class="perfil_seta">›</span>

      </a>

      <a routerLink="/"
         class="perfil_item perfil_item-home">

        <span class="perfil_icone">⌂</span>
        <span>Voltar para Home</span>
        <span class="perfil_seta">›</span>

      </a>

      <button
        type="button"
        class="perfil_item perfil_item-sair"
        (click)="abrirModalSair()"
      >
        <span class="perfil_icone">⇥</span>
        <span>Sair da conta</span>
        <span class="perfil_seta">›</span>
      </button>

    </nav>

  </aside>

  <section class="perfil_conteudo">
    <router-outlet></router-outlet>
  </section>

</main>

@if (modalSairAberto()) {

  <div class="perfil_modal-overlay" (click)="fecharModalSair()">

    <section
      class="perfil_modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="perfil-modal-titulo"
      (click)="$event.stopPropagation()"
    >

      <h2 id="perfil-modal-titulo">
        Deseja sair da sua conta?
      </h2>

      <p>
        Você precisará entrar novamente para acessar seu perfil
        e seus agendamentos.
      </p>

      <div class="perfil_modal-acoes">

        <button
          type="button"
          class="perfil_modal-cancelar"
          (click)="fecharModalSair()"
        >
          Continuar conectado
        </button>

        <button
          type="button"
          class="perfil_modal-confirmar"
          (click)="confirmarSaida()"
        >
          Sair da conta
        </button>

      </div>

    </section>

  </div>

}
