<app-header-v2></app-header-v2>

<main class="perfil">

  <aside class="perfil_menu">

    <div class="perfil_usuario">

      <div class="perfil_avatar">
        <svg class="icone_usuario" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4.5 21c.8-4.1 3.4-6.2 7.5-6.2s6.7 2.1 7.5 6.2"></path>
        </svg>
      </div>

      <div class="perfil_saudacao">
        <span>Olá,</span>
        <strong>User!</strong>
      </div>

    </div>

    <nav class="perfil_navegacao">

      <a
        routerLink="meus-dados"
        routerLinkActive="ativo"
        [routerLinkActiveOptions]="{ exact: true }"
        class="perfil_item"
      >
        <svg class="icone_usuario" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4.5 21c.8-4.1 3.4-6.2 7.5-6.2s6.7 2.1 7.5 6.2"></path>
        </svg>

        <span>Meus dados</span>

        <svg lucideChevronRight class="perfil_seta"></svg>
      </a>

      <a
        routerLink="agendamentos"
        routerLinkActive="ativo"
        class="perfil_item"
      >
        <svg class="header__icone" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3.5 2"></path>
        </svg>

        <span>Meus agendamentos</span>

        <svg lucideChevronRight class="perfil_seta"></svg>
      </a>

      <a
        routerLink="pets"
        routerLinkActive="ativo"
        class="perfil_item"
      >
        <svg lucidePawPrint class="perfil_icone"></svg>

        <span>Meus pets</span>

        <svg lucideChevronRight class="perfil_seta"></svg>
      </a>

      <a
        routerLink="alterar-senha"
        routerLinkActive="ativo"
        class="perfil_item"
      >
        <svg lucideShield class="perfil_icone"></svg>

        <span>Alterar senha</span>

        <svg lucideChevronRight class="perfil_seta"></svg>
      </a>

      <button
				type="button"
				class="perfil_item"
				(click)="abrirModalSair()"
			>
				<svg lucideSquareArrowRightExit class="perfil_icone"></svg>

				<span>Sair da conta</span>

				<svg lucideChevronRight class="perfil_seta"></svg>
			</button>

    </nav>

  </aside>

  <section class="perfil_conteudo">
    <router-outlet></router-outlet>
  </section>

	@if (modalSairAberto()) {
		<div
			class="perfil_modal-overlay"
			(click)="fecharModalSair()"
		>
			<section
				class="perfil_modal"
				role="dialog"
				aria-modal="true"
				aria-labelledby="titulo-modal-sair"
				(click)="$event.stopPropagation()"
			>
				<div class="perfil_modal-icone">
					<svg lucideSquareArrowRightExit></svg>
				</div>

				<h2 id="titulo-modal-sair">
					Sair da conta
				</h2>

				<p>
					Tem certeza de que deseja sair da sua conta?
				</p>

				<div class="perfil_modal-acoes">

					<button
						type="button"
						class="perfil_modal-cancelar"
						(click)="fecharModalSair()"
					>
						Cancelar
					</button>

					<button
						type="button"
						class="perfil_modal-confirmar"
						(click)="confirmarSaida()"
					>
						Sair da conta
					</button>

				</div>
			</section>
		</div>
	}

</main>
